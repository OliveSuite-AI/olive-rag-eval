[package]
name = "olive-rag-eval-python"
version.workspace = true
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Native PyO3 bindings for olive-rag-eval"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
rag-eval = { path = "../.." }
pyo3 = { version = "=0.29.3", features = ["abi3-py310"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
