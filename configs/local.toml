# Fill revision and artifact_sha256 from your installed artifacts. Validation
# deliberately rejects these placeholders. Copy this file for your own profiles.
corpus = "../data/starter_corpus.jsonl"
dataset = "../data/starter_cases.jsonl"
calibration = "../data/calibration_draft.jsonl"
artifacts = "../artifacts/local"
candidate_k = 20
cutoff = 5
index_bits = 4
repeats = 1
allow_truncation = false

[[embeddings]]
name = "embeddinggemma-q8"
model = "embeddinggemma-300m-q8"
revision = "PIN_GGUF_REVISION"
artifact_sha256 = "REPLACE_WITH_GGUF_FILE_SHA256"
url = "http://127.0.0.1:18081/v1"
dimensions = 768
query_prefix = "task: search result | query: "
document_prefix = "title: none | text: "
quantization = "Q8_0"

[[embeddings]]
name = "minilm"
model = "sentence-transformers/all-MiniLM-L6-v2"
revision = "PIN_HF_COMMIT"
artifact_sha256 = "REPLACE_WITH_MODEL_TREE_SHA256"
url = "http://127.0.0.1:18082/v1"
dimensions = 384
quantization = "float32"

[[rerankers]]
name = "bge-m3"
model = "BAAI/bge-reranker-v2-m3"
revision = "PIN_HF_COMMIT"
artifact_sha256 = "REPLACE_WITH_MODEL_TREE_SHA256"
url = "http://127.0.0.1:18083/v1"

[[rerankers]]
name = "laya-multilingual"
model = "convaiinnovations/laya-multilingual"
revision = "PIN_HF_COMMIT"
artifact_sha256 = "REPLACE_WITH_MODEL_TREE_SHA256"
url = "http://127.0.0.1:18084/v1"

[answer]
name = "answer-local"
model = "YOUR_ODIA_CAPABLE_ANSWER_MODEL"
revision = "PIN_MODEL_REVISION"
artifact_sha256 = "REPLACE_WITH_GGUF_FILE_SHA256"
url = "http://127.0.0.1:18085/v1"
context_tokens = 8192
max_output_tokens = 1024

[judge]
name = "judge-local"
model = "YOUR_ODIA_CAPABLE_JUDGE_MODEL"
revision = "PIN_MODEL_REVISION"
artifact_sha256 = "REPLACE_WITH_GGUF_FILE_SHA256"
url = "http://127.0.0.1:18086/v1"
context_tokens = 16384
max_output_tokens = 2048
