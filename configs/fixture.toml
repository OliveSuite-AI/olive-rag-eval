corpus = "../data/starter_corpus.jsonl"
dataset = "../data/starter_cases.jsonl"
calibration = "../data/calibration_draft.jsonl"
artifacts = "../artifacts/fixture"
fixture = true
fixture_stdio = "../services/runtime.py"
candidate_k = 20
cutoff = 5
repeats = 1

[[embeddings]]
name = "embeddinggemma-q8"
model = "fixture-embeddinggemma"
revision = "fixture-v1"
artifact_sha256 = "fixture"
url = "http://127.0.0.1:18080/v1"
dimensions = 768
query_prefix = "task: search result | query: "
document_prefix = "title: none | text: "
quantization = "synthetic"

[[embeddings]]
name = "minilm"
model = "fixture-minilm"
revision = "fixture-v1"
artifact_sha256 = "fixture"
url = "http://127.0.0.1:18080/v1"
dimensions = 384

[[rerankers]]
name = "bge-m3"
model = "fixture-bge"
revision = "fixture-v1"
artifact_sha256 = "fixture"
url = "http://127.0.0.1:18080/v1"

[[rerankers]]
name = "laya-multilingual"
model = "fixture-laya"
revision = "fixture-v1"
artifact_sha256 = "fixture"
url = "http://127.0.0.1:18080/v1"

[answer]
name = "answer-local"
model = "fixture-chat"
revision = "fixture-v1"
artifact_sha256 = "fixture"
url = "http://127.0.0.1:18080/v1"
